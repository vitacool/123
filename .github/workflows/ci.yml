name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，省额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright 在 CI 里不要复用本地服务器
  CI: 'true'
  # onnxruntime-node 1.21.0 在 Linux/x64 上会误判 CUDA（nvcc 不存在也按 CUDA 12 处理），
  # 去下载不存在的 onnxruntime-linux-x64-gpu-1.21.0.tgz 而 404，导致 pnpm install 失败。
  # 浏览器端用的是 onnxruntime-web；Node 的 CUDA EP 对本项目无用，跳过下载。
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # 类型检查 + lint + 单元测试：三者都快，合并成一个 job 减少排队。
  static-and-unit:
    name: typecheck / lint / vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 依赖的构建脚本白名单在 pnpm-workspace.yaml 的 allowBuilds 里
      # （pnpm 11 不再读 package.json 的 pnpm 字段），所以这里不需要额外的
      # 「手动跑 ffmpeg-static/install.js」步骤。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck（tsc -b）
        run: pnpm typecheck

      - name: lint（ESLint flat config）
        run: pnpm lint

      - name: 单元测试（vitest）
        run: pnpm test

      # 库构建顺带验证 vite-plugin-dts 的声明产物
      - name: 构建库产物
        run: pnpm build:lib

  e2e:
    name: playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 浏览器下载一次约 130MB（Firefox）/ 170MB（Chromium），缓存后重跑只需几秒。
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # public/ffmpeg 与 public/onnxruntime 是生成物（.gitignore），
      # playwright.config.ts 的 webServer 会在起服务前自动跑 copy 脚本。
      - name: E2E（${{ matrix.browser }}）
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: 上传失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7